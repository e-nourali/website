<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبیه‌سازی وب‌سایت فروشگاهی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="logo">فروشگاه آنلاین</div>
        <div class="menu">
            <a href="#">صفحه اصلی</a>
            <a href="#">محصولات</a>
            <a href="#">درباره ما</a>
            <a href="#">تماس با ما</a>
        </div>
    </div>

    <div class="container">
        <div class="hero">
            <h2>محصولات با کیفیت بالا، با قیمت مناسب</h2>
            <p>لذت یک خرید آنلاین آسان را تجربه کنید!</p>
        </div>

        <div class="categories">
            <h2>دسته‌بندی محصولات</h2>
            <div class="category-list">
                <div class="category-item">
                    <img src="https://via.placeholder.com/100" alt="موبایل">
                    <h3>لوازم جانبی موبایل</h3>
                </div>
                <div class="category-item">
                    <img src="https://via.placeholder.com/100" alt="مبلمان">
                    <h3>مبلمان</h3>
                </div>
                <div class="category-item">
                    <img src="https://via.placeholder.com/100" alt="آشپزخانه">
                    <h3>تجهیزات آشپزخانه</h3>
                </div>
                <div class="category-item">
                    <img src="https://via.placeholder.com/100" alt="ابزار آلات">
                    <h3>ابزار آلات</h3>
                </div>
            </div>
        </div>
